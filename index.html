<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>David Martins - Portfólio</title>
    <style>
        /* Reseta margens da página e define fundo escuro */
        body {
            margin: 0;
            padding: 0;
            background-color: #000000;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: sans-serif;
        }

        /* Container que segura o design */
        .portfolio-container {
            width: 100%;
            max-width: 800px; 
            padding: 20px; 
            box-sizing: border-box;
            text-align: center; 
        }

        /* O código que mantém a proporção exata */
        .canva-wrapper {
            position: relative;
            width: 100%;
            height: 0;
            padding-top: 449.7804%; 
            box-shadow: 0 4px 12px rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            overflow: hidden; /* Corta qualquer excesso que cause rolagem no container */
            background-color: #1a1a1a;
        }

        .canva-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            overflow: hidden; /* Força a ocultação da barra no CSS */
        }

        /* Oculta os links originais do rodapé do Canva */
        .canva-footer-link {
            display: none;
        }

        /* Estilo do Botão do WhatsApp */
        .whatsapp-btn {
            display: inline-block;
            background-color: #25D366; 
            color: #ffffff;
            text-decoration: none;
            padding: 16px 32px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 50px;
            margin-top: 40px;
            margin-bottom: 40px;
            transition: background-color 0.3s, transform 0.2s;
            box-shadow: 0 4px 10px rgba(37, 211, 102, 0.3);
        }

        .whatsapp-btn:hover {
            background-color: #1ebe57; 
            transform: scale(1.05); 
        }
    </style>
</head>
<body>

    <div class="portfolio-container">
        <!-- Iframe do Canva com scrolling="no" adicionado -->
        <div class="canva-wrapper">
            <iframe loading="lazy" 
                src="https://www.canva.com/design/DAHR_0tq5cA/Y3fPUvDzExvrX9MxJCGVmQ/view?embed" 
                allowfullscreen="allowfullscreen" 
                allow="fullscreen"
                scrolling="no">
            </iframe>
        </div>
        
        <!-- Botão do WhatsApp -->
        <a href="https://wa.me/5511975321113?text=Olá%20vim%20pelo%20seu%20Portfólio%20e%20gostaria%20de%20um%20orçamento." 
           class="whatsapp-btn" 
           target="_blank" 
           rel="noopener">
           Fale comigo pelo WhatsApp
        </a>

        <!-- Link original oculto pelo CSS -->
        <a class="canva-footer-link" href="https://www.canva.com/design/DAHR_0tq5cA/Y3fPUvDzExvrX9MxJCGVmQ/view?utm_content=DAHR_0tq5cA&utm_campaign=designshare&utm_medium=embeds&utm_source=link" target="_blank" rel="noopener">Site de Portfólio Design Gráfico</a>
    </div>

</body>
</html>
