<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>David Martins - Portfólio</title>
    <style>
        /* Reseta margens da página e define fundo escuro (opcional) */
        body {
            margin: 0;
            padding: 0;
            background-color: #000000; /* Pode mudar para a cor que preferir */
            display: flex;
            justify-content: center;
        }

        /* Container que segura o design: responsivo para Desktop e Mobile */
        .portfolio-container {
            width: 100%;
            max-width: 800px; /* Limita a largura máxima no desktop para não ficar gigante */
            padding: 20px; /* Dá um respiro nas laterais no celular */
            box-sizing: border-box;
        }

        /* O código que mantém a proporção exata do seu Canva original */
        .canva-wrapper {
            position: relative;
            width: 100%;
            height: 0;
            padding-top: 449.7804%; /* Proporção exata do seu design */
            box-shadow: 0 4px 12px rgba(255, 255, 255, 0.1); /* Sombra suave */
            border-radius: 8px;
            overflow: hidden;
            background-color: #1a1a1a; /* Fundo enquanto carrega */
        }

        .canva-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Oculta os links originais do rodapé enviados no código antigo */
        .canva-footer-link {
            display: none;
        }
    </style>
</head>
<body>

    <div class="portfolio-container">
        <!-- Seu iframe original do Canva -->
        <div class="canva-wrapper">
            <iframe loading="lazy" 
                src="https://www.canva.com/design/DAHR_0tq5cA/OJQaN0kn6E_rtMsiElrU5w/view?embed" 
                allowfullscreen="allowfullscreen" 
                allow="fullscreen">
            </iframe>
        </div>
        
        <!-- Mantive a referência do link, mas ele está oculto pelo CSS acima para deixar o site mais limpo -->
        <a class="canva-footer-link" href="https://www.canva.com/design/DAHR_0tq5cA/OJQaN0kn6E_rtMsiElrU5w/view?utm_content=DAHR_0tq5cA&utm_campaign=designshare&utm_medium=embeds&utm_source=link" target="_blank" rel="noopener">Site de Portfólio Design Gráfico</a>
    </div>

</body>
</html>
